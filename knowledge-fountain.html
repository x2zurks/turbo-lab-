<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Knowledge Fountain</title>

    <!-- main website CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Knowledge Fountain CSS -->
    <link rel="stylesheet" href="knowledge-fountain.css">
</head>

<body>

    <header>
        <h1>THE KNOWLEDGE FOUNTAIN</h1>
        <p>drink from the fountain. learn forbidden knowledge.</p>
    </header>

    <main class="fountain-container">

        <div class="warning">
            ⚠️ WARNING: INFORMATION MAY BE 0% ACCURATE ⚠️
        </div>

        <section class="fountain">

            <div class="fountain-top">
                💧
            </div>

            <div class="knowledge-box" id="knowledgeBox">
                Click the button to receive knowledge.
            </div>

            <button id="knowledgeButton">
                DRINK FROM THE FOUNTAIN
            </button>

            <p class="counter">
                Knowledge consumed:
                <span id="knowledgeCount">0</span>
            </p>

        </section>

    </main>

    <a class="back-button" href="./index.html">
        ← RETURN TO TURBO LAB
    </a>

    <script src="knowledge-fountain.js"></script>

</body>
</html>
